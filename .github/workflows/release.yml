name: Publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag must match package.json version" }
      - run: npm ci
      - run: npm test
      - name: Build installer and update metadata
        run: npm run dist -- --publish never
      - name: Verify release files
        run: node tools/verify-release.cjs
      - name: Upload complete release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "MeetNotes $version" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Could not create release" }
          }
          gh release upload $tag "dist/MeetNotes-Setup-$version.exe" "dist/MeetNotes-Setup-$version.exe.blockmap" "dist/latest.yml" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release files" }
          gh release edit $tag --draft=false --prerelease=false --latest --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
